<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator Engine</title>
    <!-- Fixed Production CDN Link for the QR Generation Matrix Library -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f5f7;
            margin: 0;
        }
        .container {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 450px;
        }
        .qr-wrapper {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            display: inline-block;
            margin: 25px 0;
            box-shadow: inset 0 0 0 1px #e5e5e7;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }
        .btn {
            padding: 12px 24px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #0077ed;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Your Core QR Engine</h2>
    <p style="color: #6e6e73; font-size: 14px;">The logo is flattened directly into the matrix blocks with Level H protection for instant scans.</p>
    
    <div class="qr-wrapper">
        <canvas id="qr-canvas"></canvas>
    </div>
    <br>
    <button class="btn" onclick="downloadQR()">Download Poster-Ready PNG</button>
</div>

<script>
    // 🔗 LINKING THEM AT LAST: Replace this link with your live Cloudflare Pages URL!
    const MY_LIVE_MENU_URL = "https://menu-app-5gy.pages.dev/"; 

    function generateQRWithLogo() {
        const canvas = document.getElementById('qr-canvas');
        const ctx = canvas.getContext('2d');
        
        // 1. Configure the matrix: Type 0 (Auto size), Level H (30% obstruction ceiling)
        const qr = qrcode(0, 'H');
        qr.addData(MY_LIVE_MENU_URL);
        qr.make();

        const moduleCount = qr.getModuleCount();
        const cellSize = 12; // Controls sharpness resolution for print formatting
        const canvasSize = moduleCount * cellSize;
        
        canvas.width = canvasSize;
        canvas.height = canvasSize;

        // 2. Clear canvas to pure crisp White
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvasSize, canvasSize);

        // 3. Draw raw black data modules
        ctx.fillStyle = '#000000';
        for (let row = 0; row < moduleCount; row++) {
            for (let col = 0; col < moduleCount; col++) {
                if (qr.isDark(row, col)) {
                    ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                }
            }
        }

        // 4. Load, calculate and burn the logo asset in the middle
        const logoImg = new Image();
        logoImg.src = 'logo.png'; // Looks for logo.png in the root of this repo
        
        logoImg.onload = function() {
            const logoSize = canvasSize * 0.18; // Constrain logo width footprint to preserve error parity bits
            const centerPos = (canvasSize - logoSize) / 2;

            // Step A: Burn a white square shield behind the logo so dark pixels don't bleed through
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(centerPos - 4, centerPos - 4, logoSize + 8, logoSize + 8);

            // Step B: Flatten the logo image permanently onto the canvas matrix array
            ctx.drawImage(logoImg, centerPos, centerPos, logoSize, logoSize);
        };
        
        logoImg.onerror = function() {
            console.warn("Logo asset 'logo.png' could not be found. Serving generic optimized matrix instead.");
        };
    }

    function downloadQR() {
        const canvas = document.getElementById('qr-canvas');
        if (!canvas) return;

        const link = document.createElement('a');
        link.download = 'menu_poster_qr_linked.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    // Run layout render process on page startup
    window.onload = generateQRWithLogo;
</script>

</body>
</html>
