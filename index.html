<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator Engine</title>
    <!-- Load the high-performance QR generation script -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f5f7;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        /* Critical for scanning: Pure white background wrapper acting as the Quiet Zone */
        .qr-wrapper {
            position: relative;
            background: #ffffff;
            padding: 16px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 20px;
        }
        canvas {
            display: block;
        }
        .logo-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 18%; /* Constrained to protect scannability blocks */
            height: 18%;
            object-fit: contain;
            background: white; /* Pads the logo so background blocks don't bleed through */
            padding: 2px;
            border-radius: 4px;
        }
        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Your Custom Menu QR Code</h2>
    <p>Right-click the image to save, or use the download button.</p>
    
    <div class="qr-wrapper" id="qr-container">
        <!-- The QR script will draw the canvas right here -->
        <img id="logo-element" src="logo.png" class="logo-overlay" alt="Logo">
    </div>
    <br>
    <button class="btn" onclick="downloadQR()">Download High-Res PNG</button>
</div>

<script>
    // 🔗 LINKING THEM AT LAST: Paste your live Cloudflare Pages URL here!
    const MY_LIVE_MENU_URL = "https://pages.dev"; 

    function generateQR() {
        // Create QR code with Type 0 (Auto-detect size) and Level H Error Correction
        const qr = qrcode(0, 'H');
        qr.addData(MY_LIVE_MENU_URL);
        qr.make();

        // Create a canvas element to render high-contrast black and white pixels
        const container = document.getElementById('qr-container');
        const cellSize = 12; // High cell size ensures a crisp image for your poster
        const margin = 0;
        
        // Generate raw HTML table modules and convert to a clean canvas drawing
        const qrImageTag = qr.createImgTag(cellSize, margin);
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = qrImageTag;
        const imgEl = tempDiv.querySelector('img');

        imgEl.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.id = 'qr-canvas';
            canvas.width = imgEl.width;
            canvas.height = imgEl.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(imgEl, 0, 0);
            
            // Insert the canvas into the wrapper right behind the centered logo image
            container.insertBefore(canvas, document.getElementById('logo-element'));
        };
    }

    function downloadQR() {
        const canvas = document.getElementById('qr-canvas');
        if (!canvas) return;
        
        // Create a temporary master canvas to flatten the QR blocks + Logo together
        const masterCanvas = document.createElement('canvas');
        masterCanvas.width = canvas.width;
        masterCanvas.height = canvas.height;
        const ctx = masterCanvas.getContext('2d');
        
        // 1. Draw the QR base
        ctx.drawImage(canvas, 0, 0);
        
        // 2. Bake the logo into the center of the downloaded file
        const logo = document.getElementById('logo-element');
        const logoSize = canvas.width * 0.18;
        const pos = (canvas.width - logoSize) / 2;
        
        // Draw white backing box under logo
        ctx.fillStyle = "white";
        ctx.fillRect(pos - 2, pos - 2, logoSize + 4, logoSize + 4);
        // Draw the logo itself
        ctx.drawImage(logo, pos, pos, logoSize, logoSize);

        // Trigger automatic download
        const link = document.createElement('a');
        link.download = 'final_poster_menu_qr.png';
        link.href = masterCanvas.toDataURL('image/png');
        link.click();
    }

    // Run on boot
    window.onload = generateQR;
</script>

</body>
</html>
